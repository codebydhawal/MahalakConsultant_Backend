spring.application.name=MahalakMedia

server.port=8080
spring.datasource.url=jdbc:mysql://localhost:3306/MahalakMedia?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf-8&autoReconnect=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto= update

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
#project.image=Documents/

google.drive.credentials=google/credentials.json
google.drive.folder-id=${GOOGLE_DRIVE_FOLDER_ID}

google.sheet.spreadsheet-id=${GOOGLE_SHEET_SPREADSHEET_ID}
google.sheet.application-name=Mahalak CMS
google.sheet.credentials=google/mahalakcredentials.json