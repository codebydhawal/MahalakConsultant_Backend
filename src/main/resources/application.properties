spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.show-sql=true
spring.jpa.generate-ddl=true
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB
#project.image=Documents/

google.drive.credentials=${GOOGLE_DRIVE_CREDENTIALS_PATH:google/credentials.json}
google.drive.folder-id=${GOOGLE_DRIVE_FOLDER_ID}
google.oauth.tokens-directory=${GOOGLE_OAUTH_TOKENS_DIRECTORY:tokens}
google.oauth.redirect-uri=${GOOGLE_OAUTH_REDIRECT_URI:http://localhost:8080/oauth2/callback}

google.sheet.spreadsheet-id=${GOOGLE_SHEET_SPREADSHEET_ID}
google.sheet.application-name=Mahalak CMS
google.sheet.credentials=${GOOGLE_SHEET_CREDENTIALS_PATH:google/mahalakcredentials.json}

app.cors.allowed-origins=${APP_CORS_ALLOWED_ORIGINS:http://localhost:3000,https://localhost:3000,http://localhost:4173,https://localhost:4173}
app.jwt.secret=${APP_JWT_SECRET}
app.bootstrap.roles-enabled=${APP_BOOTSTRAP_ROLES_ENABLED:true}
